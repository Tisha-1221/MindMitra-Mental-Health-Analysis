<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Mental Health Analysis</title>

    <!-- CSS link -->
    <link rel="stylesheet" href="../static/login_style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <h2>Mental Health Analysis</h2>
        <a href="login.html">Logout</a>
    </div>

    <!-- Main Dashboard Container -->
    <div class="dashboard-container">

        <h1>Welcome to Your Dashboard</h1>
        <p>Select an option to continue</p>

        <!-- Dashboard Cards -->
        <div class="card-container">

            <div class="card">
                <h3>Submit Daily Response</h3>
                <p>Fill the mental health form</p>
                <a href="https://forms.google.com" target="_blank">Open Form</a>
            </div>

            <div class="card">
                <h3>View Dashboard</h3>
                <p>See sentiment & behavior analysis</p>
                <a href="#">Open Dashboard</a>
            </div>

            <div class="card">
                <h3>My Profile</h3>
                <p>View personal information</p>
                <a href="#">View Profile</a>
            </div>

        </div>
    </div>

</body>
</html>
